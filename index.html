<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 10</title>
</head>
<body>
    <h1>
        Somando números
    </h1>
    <input type="number" name="txt1" id="idtxt1"> +   
    <input type="number" name="txt2" id="idtxt2">    
    <input type="button" value="somar" onclick="somar()">
    <div id="res">Resultado</div>
    <script>
        function somar() {
            var tn1 = window.document.getElementById('idtxt1')
            var tn2 = window.document.querySelector('input#idtxt2')
            var n1 = Number.parseInt('tn1.value')
            var n2 = Number('tn2.value')
            var s = n1 + n2
            res.innerText = 'A soma entre ${n1} e ${n2} é igual a ${s}'
        }
    </script>

</body>
</html>
